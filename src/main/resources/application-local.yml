# Profil 'local' – aktiveres som standard av spring-boot-maven-plugin (mvn spring-boot:run).
# DataSource leveres av LocalDataSourceConfig (Zonky embedded Postgres, flyktig).
spring:
  config:
    # Leser API-nøkler o.l. fra .env i prosjektmappen hvis den finnes (se .env.example).
    # Bare lokalt: prod bruker Fly secrets. Miljøvariabler vinner over .env.
    import: optional:file:.env[.properties]

fridgecam:
  jwt:
    # Bare for lokal utvikling. Prod bruker JWT_SECRET.
    hemmelighet: ${JWT_SECRET:lokal-utviklingshemmelighet-som-aldri-brukes-i-prod}
  local-db:
    # Låst port så en DB-tilkobling i IntelliJ overlever omstart.
    # 55433 for å ikke kollidere med talik-ai (55432). 0 = tilfeldig ledig port.
    port: ${FRIDGECAM_LOCAL_DB_PORT:55433}
  ai:
    # Lokalt brukes fake-leverandøren med mindre AI_PROVIDER er satt.
    provider: ${AI_PROVIDER:fake}
    # Så lastevisningen i appen synes, som med et ekte AI-kall.
    fake-forsinkelse: 1500ms

logging:
  level:
    io.zonky.test.db.postgres: INFO
    org.flywaydb.core: INFO
