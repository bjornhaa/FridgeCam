spring:
  application:
    name: fridgecam
  # Datasource settes i prod via miljøvariablene SPRING_DATASOURCE_URL,
  # SPRING_DATASOURCE_USERNAME og SPRING_DATASOURCE_PASSWORD (Fly secrets).
  # Lokalt leverer LocalDataSourceConfig en innebygd Postgres (local-profil).
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Bildet krympes i nettleseren til noen hundre kB; 10 MB gir god margin.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  tomcat:
    # Når et bilde er for stort, leser Tomcat resten av forespørselen før den
    # svarer. Er den over denne grensen, lukkes forbindelsen i stedet, og
    # klienten får nettverksfeil i stedet for feilkoden bilde_for_stort.
    max-swallow-size: 20MB
  forward-headers-strategy: framework
  # Riktig MIME-type for PWA-manifestet (#47); Tomcat kjenner ikke .webmanifest.
  mime-mappings:
    webmanifest: application/manifest+json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.haakenstad.fridgecam: INFO

fridgecam:
  jwt:
    # Må settes i prod (Fly secret), minst 32 tegn; appen starter ikke uten.
    # Lag en med: openssl rand -base64 48
    hemmelighet: ${JWT_SECRET:}
    levetid: 30d
  ai:
    # fake | anthropic | gemini. Må settes i prod; appen starter ikke uten.
    provider: ${AI_PROVIDER:}
    # Tom = leverandørens standardmodell (anthropic: claude-opus-5-5, gemini: gemini-4-hydrogen).
    model: ${AI_MODEL:}
    # Ingen felles AI-nøkkel i prod: hver husstand legger inn sin egen under Profil (#42).
    # Nøklene krypteres med denne (base64, 32 byte). Må settes i prod; appen starter ikke uten.
    # Lag en med: openssl rand -base64 32. Mistes den, må alle husstander legge inn nøkkelen på nytt.
    nokkel-kryptering: ${FRIDGECAM_NOKKEL_KRYPTERING:}
    # low | medium | high: hvor mye modellen tenker. Lavere = raskere og billigere.
    effort: ${AI_EFFORT:medium}
